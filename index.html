<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NINA | Velas Artesanais</title>
  <meta
    name="description"
    content="Conheça a NINA Velas Artesanais e acesse nossas redes sociais e produtos."
  >
  <meta name="theme-color" content="#EAE2D5">

  <!-- Carregamento da fonte -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >
  <link
    href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --fundo: #EAE2D5;
      --branco: #FFFFFF;
      --preto: #111111;
      --dourado: #B49A72;
      --fonte: "Bodoni Moda", Georgia, serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--fundo);
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 48px 24px 36px;
      background: var(--fundo);
      color: var(--preto);
      font-family: var(--fonte);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    img,
    svg {
      image-rendering: auto;
    }

    /* Área principal */
    .pagina {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Botão de compartilhar */
    .compartilhar {
      position: fixed;
      top: 22px;
      right: 24px;
      z-index: 10;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 48px;
      height: 48px;
      padding: 0;

      border: none;
      border-radius: 50%;
      background: var(--branco);
      color: var(--preto);
      cursor: pointer;

      transition: transform 0.2s ease;
    }

    .compartilhar:hover {
      transform: scale(1.05);
    }

    .compartilhar svg {
      width: 23px;
      height: 23px;
    }

    /* Logo original */
    .logo-area {
      width: 172px;
      height: 172px;
      margin: 8px auto 32px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
      border-radius: 50%;
      background: var(--branco);
    }

    .logo-area img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Botões dos links */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link {
      width: 100%;
      min-height: 66px;
      padding: 12px 24px;

      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) 34px;
      align-items: center;
      column-gap: 12px;

      border: 1px solid rgba(0, 0, 0, 0.025);
      border-radius: 999px;
      background: var(--branco);
      color: var(--preto);
      text-decoration: none;
      text-align: center;

      font-family: var(--fonte);
      font-size: 23px;
      font-weight: 400;
      line-height: 1.25;

      box-shadow: 0 2px 7px rgba(65, 48, 30, 0.025);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .link:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 14px rgba(65, 48, 30, 0.07);
    }

    .link:focus-visible,
    .compartilhar:focus-visible {
      outline: 2px solid var(--dourado);
      outline-offset: 4px;
    }

    .icone {
      width: 30px;
      height: 30px;
      display: block;
      justify-self: center;
      stroke: currentColor;
    }

    .texto-link {
      grid-column: 2;
    }

    /* Aviso do site */
    .aviso {
      display: none;
      width: 100%;
      margin-top: 18px;
      padding: 15px 18px;

      border: 1px solid rgba(180, 154, 114, 0.45);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.6);

      font-family: Arial, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      text-align: center;
    }

    .aviso.visivel {
      display: block;
    }

    /* Frase do rodapé */
    .rodape {
      margin-top: 28px;
      color: #786D5F;
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 2px;
      text-align: center;
    }

    /* Computadores e telas maiores */
    @media (min-width: 768px) {
      body {
        padding-top: 52px;
        padding-bottom: 40px;
      }

      .pagina {
        max-width: 440px;
      }

      .logo-area {
        width: 158px;
        height: 158px;
        margin-top: 4px;
        margin-bottom: 28px;
      }

      .links {
        gap: 13px;
      }

      .link {
        min-height: 62px;
        padding: 10px 22px;
        font-size: 21px;
      }

      .icone {
        width: 27px;
        height: 27px;
      }

      .compartilhar {
        top: 20px;
        right: 22px;
        width: 44px;
        height: 44px;
      }
    }

    /* Celulares: preserva o layout atual */
    @media (max-width: 480px) {
      body {
        padding: 76px 20px 28px;
      }

      .pagina {
        max-width: 390px;
      }

      .logo-area {
        width: 158px;
        height: 158px;
        margin-bottom: 28px;
      }

      .links {
        gap: 12px;
      }

      .link {
        min-height: 60px;
        padding: 10px 17px;
        grid-template-columns: 29px minmax(0, 1fr) 29px;
        column-gap: 8px;
        font-size: 19px;
      }

      .icone {
        width: 25px;
        height: 25px;
      }

      .compartilhar {
        top: 16px;
        right: 16px;
        width: 42px;
        height: 42px;
      }

      .rodape {
        margin-top: 24px;
      }
    }

    /* Celulares pequenos */
    @media (max-width: 340px) {
      body {
        padding-right: 14px;
        padding-left: 14px;
      }

      .link {
        padding-right: 12px;
        padding-left: 12px;
        font-size: 17px;
      }
    }

    /* Respeita a preferência por menos movimento */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>

  <!-- Botão de compartilhar -->
  <button
    class="compartilhar"
    id="botaoCompartilhar"
    type="button"
    aria-label="Compartilhar página"
    title="Compartilhar página"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <circle cx="18" cy="5" r="3"></circle>
      <circle cx="6" cy="12" r="3"></circle>
      <circle cx="18" cy="19" r="3"></circle>
      <path d="m8.7 10.7 6.6-4.4"></path>
      <path d="m8.7 13.3 6.6 4.4"></path>
    </svg>
  </button>

  <main class="pagina">

    <!-- Logo oficial: mantenha LOGO.jpeg no repositório -->
    <div class="logo-area">
      <img
        src="LOGOtipo.png"
        alt="NINA Velas Artesanais"
        width="172"
        height="172"
      >
    </div>

    <!-- Links oficiais -->
    <nav class="links" aria-label="Links da NINA">

      <!-- Nosso site -->
      <a class="link" href="#" id="linkSite">
        <svg
          class="icone"
          viewBox="0 0 24 24"
          fill="none"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M2 12h20"></path>
          <path d="M12 2a15 15 0 0 1 0 20"></path>
          <path d="M12 2a15 15 0 0 0 0 20"></path>
          <path d="M4.9 5.5h14.2"></path>
          <path d="M4.9 18.5h14.2"></path>
        </svg>

        <span class="texto-link">Nosso site</span>
        <span aria-hidden="true"></span>
      </a>

      <!-- Instagram -->
      <a
        class="link"
        href="https://instagram.com/velas_nina"
        target="_blank"
        rel="noopener noreferrer"
      >
        <svg
          class="icone"
          viewBox="0 0 24 24"
          fill="none"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="3" y="3" width="18" height="18" rx="5"></rect>
          <circle cx="12" cy="12" r="4"></circle>
          <circle
            cx="17.5"
            cy="6.5"
            r="0.8"
            fill="currentColor"
          ></circle>
        </svg>

        <span class="texto-link">Instagram</span>
        <span aria-hidden="true"></span>
      </a>

      <!-- E-mail -->
      <a
        class="link"
        href="mailto:velasniina@gmail.com"
      >
        <svg
          class="icone"
          viewBox="0 0 24 24"
          fill="none"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="2.5" y="4.5" width="19" height="15" rx="2"></rect>
          <path d="m3.5 6 8.5 7 8.5-7"></path>
        </svg>

        <span class="texto-link">E-mail</span>
        <span aria-hidden="true"></span>
      </a>

      <!-- Shopee -->
      <a
        class="link"
        href="https://br.shp.ee/zG9P2De4"
        target="_blank"
        rel="noopener noreferrer"
      >
        <svg
          class="icone"
          viewBox="0 0 24 24"
          fill="none"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M5 8h14l1 13H4L5 8Z"></path>
          <path d="M9 9V6a3 3 0 0 1 6 0v3"></path>
        </svg>

        <span class="texto-link">Compre na Shopee</span>
        <span aria-hidden="true"></span>
      </a>

    </nav>

    <!-- Aviso ao clicar em Nosso site -->
    <div
      class="aviso"
      id="avisoSite"
      role="status"
      aria-live="polite"
    >
      Nosso site oficial está chegando. Em breve!
    </div>

    <!-- Rodapé -->
    <footer class="rodape">
      Fragrâncias que transformam momentos. ✨
    </footer>

  </main>

  <script>
    const linkSite = document.getElementById("linkSite");
    const avisoSite = document.getElementById("avisoSite");
    const botaoCompartilhar =
      document.getElementById("botaoCompartilhar");

    // Mostra o aviso do site em desenvolvimento
    linkSite.addEventListener("click", function (evento) {
      evento.preventDefault();
      avisoSite.classList.add("visivel");
    });

    // Compartilha a página ou copia o link
    botaoCompartilhar.addEventListener("click", async function () {
      const dados = {
        title: "NINA | Velas Artesanais",
        text: "Conheça a NINA Velas Artesanais!",
        url: window.location.href
      };

      if (navigator.share) {
        try {
          await navigator.share(dados);
        } catch (erro) {
          if (erro.name !== "AbortError") {
            copiarLink();
          }
        }
      } else {
        copiarLink();
      }
    });

    async function copiarLink() {
      try {
        await navigator.clipboard.writeText(window.location.href);
        alert("Link da página copiado para compartilhar!");
      } catch (erro) {
        window.prompt(
          "Copie o link da sua página:",
          window.location.href
        );
      }
    }
  </script>

</body>
</html>
