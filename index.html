
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#EAE2D5">

  <title>NINA | Velas Artesanais</title>

  <meta
    name="description"
    content="Conheça os links oficiais da NINA Velas Artesanais."
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --fundo: #EAE2D5;
      --branco: #FFFFFF;
      --preto: #111111;
      --dourado: #B49A72;
      --fonte: "Bodoni Moda", Georgia, serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--fundo);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--fundo);
      color: var(--preto);
      font-family: var(--fonte);
      -webkit-font-smoothing: antialiased;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    .pagina {
      position: relative;
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 56px 24px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* BOTÃO DE COMPARTILHAR */

    .compartilhar {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 50%;
      background: var(--branco);
      color: var(--preto);
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .compartilhar:hover {
      transform: scale(1.05);
    }

    .compartilhar svg {
      width: 23px;
      height: 23px;
    }

    /* LOGO */

    .logo-area {
      position: relative;
      flex-shrink: 0;
      width: 172px;
      height: 172px;
      margin: 0 auto 28px;
      border-radius: 50%;
      overflow: hidden;
      background: var(--branco);
    }

    .logo-area img {
      position: absolute;
      top: 50%;
      left: 50%;
      display: block;
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      object-fit: contain;
      transform: translate(-50%, -50%);
    }

    /* LISTA DE LINKS */

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link {
      position: relative;
      width: 100%;
      min-height: 66px;
      padding: 12px 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: var(--branco);
      color: var(--preto);
      text-decoration: none;
      font-family: var(--fonte);
      font-size: 22px;
      font-weight: 400;
      text-align: center;
      box-shadow: 0 2px 5px rgba(50, 35, 20, 0.025);
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .link:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 14px rgba(65, 48, 30, 0.07);
    }

    .link:focus-visible,
    .compartilhar:focus-visible {
      outline: 2px solid var(--dourado);
      outline-offset: 4px;
    }

    .icone {
      position: absolute;
      left: 27px;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icone svg {
      width: 100%;
      height: 100%;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .aviso {
      display: none;
      width: 100%;
      margin-top: 12px;
      padding: 13px 16px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.8);
      color: var(--preto);
      font-family: Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
    }

    .aviso.visivel {
      display: block;
    }

    /* ASSINATURA */

    .assinatura {
      margin-top: 26px;
      color: #8C7354;
      font-family: Arial, sans-serif;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 2.2px;
      text-align: center;
    }

    /* COMPUTADORES */

    @media (min-width: 768px) {
      .pagina {
        max-width: 440px;
        padding: 56px 0 30px;
      }

      .logo-area {
        width: 158px;
        height: 158px;
        margin-bottom: 28px;
      }

      .logo-area img {
        width: 120%;
        height: 120%;
      }

      .links {
        gap: 14px;
      }

      .link {
        min-height: 62px;
        font-size: 21px;
      }

      .icone {
        left: 27px;
        width: 25px;
        height: 25px;
      }

      .compartilhar {
        position: fixed;
        top: 20px;
        right: 24px;
      }
    }

    /* CELULARES */

    @media (max-width: 480px) {
      .pagina {
        max-width: 390px;
        padding: 76px 24px 30px;
      }

      .logo-area {
        width: 158px;
        height: 158px;
        margin-bottom: 28px;
      }

      .logo-area img {
        width: 100%;
        height: 100%;
      }

      .link {
        min-height: 60px;
        padding: 12px 48px;
        font-size: 19px;
      }

      .icone {
        left: 23px;
        width: 24px;
        height: 24px;
      }

      .compartilhar {
        top: 14px;
        right: 14px;
        width: 44px;
        height: 44px;
      }

      .assinatura {
        margin-top: 26px;
        font-size: 9px;
      }
    }

    @media (max-width: 340px) {
      .pagina {
        padding-right: 16px;
        padding-left: 16px;
      }

      .link {
        padding-right: 42px;
        padding-left: 42px;
        font-size: 17px;
      }

      .icone {
        left: 18px;
        width: 22px;
        height: 22px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="pagina">

    <button
      class="compartilhar"
      id="botaoCompartilhar"
      type="button"
      aria-label="Compartilhar página"
      title="Compartilhar página"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="18" cy="5" r="3"></circle>
        <circle cx="6" cy="12" r="3"></circle>
        <circle cx="18" cy="19" r="3"></circle>
        <path d="m8.7 10.5 6.6-4"></path>
        <path d="m8.7 13.5 6.6 4"></path>
      </svg>
    </button>

    <div class="logo-area">
      <img
        src="LOGO.jpeg"
        alt="NINA Velas Artesanais"
        fetchpriority="high"
      >
    </div>

    <nav class="links" aria-label="Links oficiais da NINA">

      <a class="link" href="#" id="linkSite">
        <span class="icone" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9.5"></circle>
            <path d="M2.8 9h18.4"></path>
            <path d="M2.8 15h18.4"></path>
            <path d="M12 2.5c2.5 2.6 3.8 5.8 3.8 9.5S14.5 18.9 12 21.5"></path>
            <path d="M12 2.5C9.5 5.1 8.2 8.3 8.2 12s1.3 6.9 3.8 9.5"></path>
          </svg>
        </span>
        <span>Nosso site</span>
      </a>

      <a
        class="link"
        href="https://instagram.com/velas_nina"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="icone" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="5"></rect>
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M17.5 6.5h.01"></path>
          </svg>
        </span>
        <span>Instagram</span>
      </a>

      <a
        class="link"
        href="mailto:velasniina@gmail.com"
      >
        <span class="icone" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <rect x="2.5" y="4.5" width="19" height="15" rx="1.5"></rect>
            <path d="m3.5 6 8.5 7 8.5-7"></path>
          </svg>
        </span>
        <span>E-mail</span>
      </a>

      <a
        class="link"
        href="https://br.shp.ee/zG9P2De4"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="icone" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M5 8h14l1.5 13h-17L5 8Z"></path>
            <path d="M9 8V5a3 3 0 0 1 6 0v3"></path>
          </svg>
        </span>
        <span>Compre na Shopee</span>
      </a>

    </nav>

    <div
      class="aviso"
      id="avisoSite"
      role="status"
      aria-live="polite"
    >
      Nosso site oficial está chegando. Em breve!
    </div>

    <footer class="assinatura">
      NINA · VELAS ARTESANAIS
    </footer>

  </main>

  <script>
    const linkSite = document.getElementById("linkSite");
    const avisoSite = document.getElementById("avisoSite");
    const botaoCompartilhar =
      document.getElementById("botaoCompartilhar");

    linkSite.addEventListener("click", function (evento) {
      evento.preventDefault();
      avisoSite.classList.toggle("visivel");
    });

    botaoCompartilhar.addEventListener("click", async function () {
      const dados = {
        title: "NINA | Velas Artesanais",
        text: "Conheça os links oficiais da NINA Velas Artesanais.",
        url: window.location.href
      };

      try {
        if (navigator.share) {
          await navigator.share(dados);
        } else if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(dados.url);
          alert("Link da página copiado!");
        } else {
          window.prompt("Copie o link da página:", dados.url);
        }
      } catch (erro) {
        if (erro.name !== "AbortError") {
          window.prompt("Copie o link da página:", dados.url);
        }
      }
    });
  </script>
</body>
</html>
