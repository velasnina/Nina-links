
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NINA | Velas Artesanais</title>

  <meta
    name="description"
    content="Conheça a NINA Velas Artesanais. Acesse nosso Instagram, loja e contato."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 20px;
      background: #EAE2D5;
      color: #333;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 460px;
      text-align: center;
    }

    .logo-area {
      width: 250px;
      height: 250px;
      margin: 0 auto 25px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

.logo-area img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  transform: scale(1.4);
}

    h1 {
      margin: 0 0 8px;
      font-size: 25px;
      letter-spacing: 3px;
      font-weight: 500;
    }

    .subtitle {
      margin: 0 0 30px;
      font-size: 14px;
      letter-spacing: 2px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link {
      display: block;
      width: 100%;
      padding: 16px 20px;
      border: 1px solid #8B775E;
      border-radius: 40px;
      background: #F8F5EF;
      color: #44382D;
      text-decoration: none;
      font-size: 15px;
      transition: background 0.2s, transform 0.2s;
    }

    .link:hover {
      background: #DED0BC;
      transform: translateY(-2px);
    }

    .footer {
      margin-top: 30px;
      font-size: 12px;
      letter-spacing: 1px;
      color: #6B5C4D;
    }

    @media (max-width: 480px) {
      body {
        padding: 30px 22px;
      }

      .logo-area {
        width: 220px;
        height: 220px;
      }

      h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <div class="logo-area">
      <img
        src="LOGO.jpeg"
        alt="NINA Velas Artesanais"
      >
    </div>

    <h1>NINA</h1>
    <p class="subtitle">VELAS ARTESANAIS</p>

    <nav class="links" aria-label="Links oficiais da NINA">

      <a class="link" href="#" id="linkSite">
        Nosso site
      </a>

      <a
        class="link"
        href="https://instagram.com/velas_nina"
        target="_blank"
        rel="noopener noreferrer"
      >
        Instagram
      </a>

      <a class="link" href="mailto:velasniina@gmail.com">
        Entre em contato por e-mail
      </a>

      <a
        class="link"
        href="https://br.shp.ee/zG9P2De4"
        target="_blank"
        rel="noopener noreferrer"
      >
        Nossa loja na Shopee
      </a>

      <button class="link" type="button" id="shareButton">
        Compartilhar página
      </button>

    </nav>

    <p class="footer">
      Feito com carinho · NINA Velas Artesanais
    </p>

  </main>

  <script>
    document.getElementById("linkSite").addEventListener("click", function(event) {
      event.preventDefault();

      alert("Nosso site oficial está chegando. Em breve!");
    });

    document.getElementById("shareButton").addEventListener("click", async function() {
      const dados = {
        title: "NINA | Velas Artesanais",
        text: "Conheça a NINA Velas Artesanais!",
        url: window.location.href
      };

      try {
        if (navigator.share) {
          await navigator.share(dados);
        } else if (navigator.clipboard) {
          await navigator.clipboard.writeText(dados.url);
          alert("Link da página copiado!");
        } else {
          prompt("Copie o link da página:", dados.url);
        }
      } catch (erro) {
        if (erro.name !== "AbortError") {
          alert("Você pode copiar o endereço da página para compartilhar.");
        }
      }
    });
  </script>
</body>
</html>
